<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>turboTURBO - Maşın Elanları</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo">turboTURBO</a>
        <nav class="nav-links">
          <a href="#" class="active">Bütün elanlar</a>
          <a href="#">Dilerlər</a>
          <a href="#">Avtokataloq</a>
          <a href="#">Moto</a>
          <a href="#">Ehtiyat hissələr</a>
          <a href="#">İcarə</a>
        </nav>
      </div>
      <button class="btn-add-ad" id="open-add-modal">+ Yeni elan</button>
    </header>

    <main class="container">
      <h2>PREMİUM ELANLAR</h2>
      <div id="cars-container" class="cars-grid"></div>
    </main>

    <div class="modal-overlay" id="add-modal">
      <div class="modal-content">
        <span class="close-btn" id="close-add-modal">&times;</span>
        <h3>Yeni Elan Yaradın</h3>
        <form id="add-car-form">
          <input
            type="text"
            id="marka"
            placeholder="Marka (məs: BMW)"
            required
          />
          <input
            type="text"
            id="model"
            placeholder="Model (məs: M5)"
            required
          />
          <input
            type="number"
            id="year"
            placeholder="İl (məs: 2022)"
            required
          />
          <input
            type="number"
            step="0.1"
            id="engine"
            placeholder="Mühərrik (məs: 4.4)"
            required
          />
          <input type="number" id="price" placeholder="Qiymət" required />
          <select id="currency">
            <option value="AZN">AZN</option>
            <option value="USD">USD</option>
          </select>
          <select id="gearbox">
            <option value="Avtomat">Avtomat</option>
            <option value="Mexanika">Mexanika</option>
          </select>
          <input type="number" id="mileage" placeholder="Yürüş (km)" required />
          <input
            type="number"
            id="power"
            placeholder="At gücü (d.q.)"
            required
          />
          <input
            type="text"
            id="cover"
            placeholder="Şəkil yolu (məs: images/bmw.jpg və ya URL)"
            required
          />
          <label><input type="checkbox" id="isNew" /> Yeni maşındır?</label>
          <button type="submit" class="btn-submit">Əlavə et</button>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
